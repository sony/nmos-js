# Example deployment of the NMOS Bridge (adapter + Envoy on :8080).
#
# Always set REGISTRY_QUERY_URL to a Query API these containers can reach.
# The sample hostname `registry` only works if that name is on this Compose
# network. A Registry on the Docker host typically needs host.docker.internal
# (uncomment extra_hosts on Linux/WSL) and often REGISTRY_QUERY_WS_URL when
# the advertised Query ws_href is not reachable from the adapter.
#
# Leave APP_URL unset unless Envoy should serve the UI (standalone nmos-js
# at /, or a Registry under /admin). Do not point it at a hostname that
# is not running.

services:
  adapter:
    build: ./adapter
    restart: unless-stopped
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      # Query API used to discover Nodes and Devices; also upstream for
      # /x-nmos/query/ (and /x-dns-sd/, /log/ unless overridden below)
      REGISTRY_QUERY_URL: http://registry:8870/x-nmos/query/v1.3
      # host Registry, with extra_hosts above:
      # REGISTRY_QUERY_URL: http://host.docker.internal:3211/x-nmos/query/v1.3
      # optional: Query WebSocket scheme/authority when ws_href is not reachable
      # from the adapter or Envoy (also upstream for /x-nmos-bridge/.../query/
      # subscription WebSockets). Example when query_ws_port is HTTP+1:
      # REGISTRY_QUERY_WS_URL: ws://registry:8871
      # REGISTRY_QUERY_WS_URL: ws://host.docker.internal:3213
      # optional: different host/port for /x-dns-sd/ (default: same as Query)
      # REGISTRY_DNS_SD_URL: http://registry:3208
      # optional: different host/port for /log/ (default: same as Query)
      # REGISTRY_LOGGING_URL: http://registry:5106
      # optional: serve the UI through Envoy (catch-all /)
      # APP_URL: http://nmos-js:80
    volumes:
      - envoy-dynamic:/etc/envoy/dynamic

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    depends_on:
      - adapter
    ports:
      - "8080:8080"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/location_rewrite.lua:/etc/envoy/location_rewrite.lua:ro
      - envoy-dynamic:/etc/envoy/dynamic

volumes:
  envoy-dynamic:
